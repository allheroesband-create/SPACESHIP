    <style>
/* --- カーソル：ベース --- */
body { cursor: none; margin:0; background:#0a0a0a; color:#e0e0e0; }

#cursor {
  position: fixed;
  left: 0; top: 0;
  width: 14px; height: 14px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2147483647;
  background: radial-gradient(circle, #fff 0%, #fff 40%, #ffeecc 70%, transparent 100%);
  box-shadow: 0 0 12px #fff, 0 0 24px #fff, 0 0 36px #ffeecc;
  clip-path: polygon(50% 0%,62.5% 28.4%,93.3% 25%,75% 50%,93.3% 75%,62.5% 71.7%,50% 100%,37.5% 71.7%,6.7% 75%,25% 50%,6.7% 25%,37.5% 28.4%);
  animation: starMorph 2s ease-in-out infinite;
  will-change: transform, left, top;
}

@keyframes starMorph {
  0%,100% { clip-path: polygon(50% 0%,62.5% 28.4%,93.3% 25%,75% 50%,93.3% 75%,62.5% 71.7%,50% 100%,37.5% 71.7%,6.7% 75%,25% 50%,6.7% 25%,37.5% 28.4%); }
  25%      { clip-path: polygon(50% 2%,64% 27%,94% 23%,77% 50%,94% 77%,64% 74%,50% 98%,36% 74%,6% 77%,23% 50%,6% 23%,36% 27%); }
  50%      { clip-path: polygon(50% 4%,61% 30%,91% 27%,73% 50%,91% 73%,61% 70%,50% 96%,39% 70%,9% 73%,27% 50%,9% 27%,39% 30%); }
  75%      { clip-path: polygon(50% 1%,63% 29%,95% 24%,76% 50%,95% 76%,63% 73%,50% 99%,37% 73%,5% 76%,24% 50%,5% 24%,37% 29%); }
}

.cursor-trail {
  position: fixed;
  left: 0; top: 0;
  width: 6px; height: 6px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 2147483646;
  background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 30%, transparent 80%);
  will-change: transform, opacity;
  animation: trailFade 900ms cubic-bezier(.22,.9,.3,1) forwards;
}

@keyframes trailFade {
  0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
}
    </style>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        #page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        #header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 3px solid #ffffff;
            border-radius: 0 0 50% 50% / 0 0 30px 30px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
        }

        #header h1 {
            font-size: 3em;

            color: #ffffff;
            letter-spacing: 8px;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        #header h1 a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        #header h1 a:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        #content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .square-button {
            aspect-ratio: 1;
            background-color: #1a1a1a !important;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #ffffff;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            padding: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border-radius: 15px;
        }

        .square-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .square-button:hover {
            border-color: #ffffff;
            color: #ffffff;
            transform: scale(1.15) translateZ(20px);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .square-button:hover::before {
            left: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 2px solid #333;
            border-radius: 50% 50% 0 0 / 30px 30px 0 0;
            color: #666;
        }

        #footer a { color: #ffffff; text-decoration: none; }

        @media (max-width: 768px) {

        }

        #bg-gif {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url('QC2.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
        }
    </style>

    <!-- アスペクト比を一括設定 -->
    <script>
      [
        { id: 'btn-qc5',             src: 'QC5.png'              },

    <script>
(function(){
  const cursor = document.getElementById('cursor');
  if(!cursor) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX, cursorY = mouseY;

  const minInterval = 40;
  let lastTrailTime = 0;
  const maxTrails = 60;
  let activeTrails = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }, { passive: true });

  function onTouch(e){
    if(!e) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    mouseX = t.clientX; mouseY = t.clientY;
    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }
  document.addEventListener('touchstart', onTouch, { passive: true });
  document.addEventListener('touchmove', onTouch, { passive: true });

  function updateLoop(){
    cursorX += (mouseX - cursorX) * 0.22;
    cursorY += (mouseY - cursorY) * 0.22;
    cursor.style.left = cursorX + 'px';
    cursor.style.top  = cursorY + 'px';
    requestAnimationFrame(updateLoop);
  }
  requestAnimationFrame(updateLoop);

  function spawnTrail(x, y){
    const el = document.createElement('div');
    el.className = 'cursor-trail';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    const s = 4 + Math.random() * 6;
    el.style.width   = s + 'px';
    el.style.height  = s + 'px';
    el.style.opacity = (0.7 + Math.random() * 0.3).toString();
    document.body.appendChild(el);
    activeTrails++;
    setTimeout(() => {
      if(el && el.parentNode) el.parentNode.removeChild(el);
      activeTrails = Math.max(0, activeTrails - 1);
    }, 1050);
  }

  window.__cursorTrailStatus = () => ({ mouseX, mouseY, cursorX, cursorY, activeTrails });
})();
    </script>
