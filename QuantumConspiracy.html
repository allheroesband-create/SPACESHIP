/* --- カーソル：ベース --- */
body { cursor: none; margin:0; background:#0a0a0a; color:#e0e0e0; }

/* カーソル本体 */
#cursor {
  position: fixed;
  left: 0; top: 0;
  width: 14px; height: 14px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2147483647; /* 最前面 */
  background: radial-gradient(circle, #fff 0%, #fff 40%, #ffeecc 70%, transparent 100%);
  box-shadow: 0 0 12px #fff, 0 0 24px #fff, 0 0 36px #ffeecc;
  clip-path: polygon(50% 0%,62.5% 28.4%,93.3% 25%,75% 50%,93.3% 75%,62.5% 71.7%,50% 100%,37.5% 71.7%,6.7% 75%,25% 50%,6.7% 25%,37.5% 28.4%);
  animation: starMorph 2s ease-in-out infinite;
  will-change: transform, left, top;
  pointer-events: none;
}

/* 六芒星のゆらぎ */
@keyframes starMorph {
  0%,100% { clip-path: polygon(50% 0%,62.5% 28.4%,93.3% 25%,75% 50%,93.3% 75%,62.5% 71.7%,50% 100%,37.5% 71.7%,6.7% 75%,25% 50%,6.7% 25%,37.5% 28.4%); }
  25%      { clip-path: polygon(50% 2%,64% 27%,94% 23%,77% 50%,94% 77%,64% 74%,50% 98%,36% 74%,6% 77%,23% 50%,6% 23%,36% 27%); }
  50%      { clip-path: polygon(50% 4%,61% 30%,91% 27%,73% 50%,91% 73%,61% 70%,50% 96%,39% 70%,9% 73%,27% 50%,9% 27%,39% 30%); }
  75%      { clip-path: polygon(50% 1%,63% 29%,95% 24%,76% 50%,95% 76%,63% 73%,50% 99%,37% 73%,5% 76%,24% 50%,5% 24%,37% 29%); }
}

/* 軌跡 */
.cursor-trail {
  position: fixed;
  left: 0; top: 0;
  width: 6px; height: 6px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 2147483646;
  background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 30%, transparent 80%);
  will-change: transform, opacity;
  animation: trailFade 900ms cubic-bezier(.22,.9,.3,1) forwards;
}

/* 軌跡フェード（短めで視認性良く） */
@keyframes trailFade {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
}
</style>

    <script>
        function toggleTab(tab) {
            const homeHeader = document.getElementById('home-header');
            const menuHeader = document.getElementById('menu-header');
            const homeContent = document.getElementById('home-content');
            const menuContent = document.getElementById('menu-content');

            if (tab === 'home') {
                homeHeader.classList.add('header_highlight');
                menuHeader.classList.remove('header_highlight');
                homeContent.classList.add('active');
                menuContent.classList.remove('active');
            } else {
                menuHeader.classList.add('header_highlight');
                homeHeader.classList.remove('header_highlight');
                menuContent.classList.add('active');
                homeContent.classList.remove('active');
            }
        }

        function toggleArchiveCategory(category) {
            const itemsDiv = document.getElementById(category + '-items');
            const button = event.target;
            
            if (itemsDiv.classList.contains('show')) {
                itemsDiv.classList.remove('show');
                button.classList.remove('active');
            } else {
                itemsDiv.classList.add('show');
                button.classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('home-content') && document.getElementById('home-content').classList.add('active');
        });
    </script>

    <script>
(function(){
  const cursor = document.getElementById('cursor');
  if(!cursor) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX, cursorY = mouseY;

  const minInterval = 40;
  let lastTrailTime = 0;
  const maxTrails = 60;
  let activeTrails = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;

    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }, { passive: true });

  function onTouch(e){
    if(!e) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    mouseX = t.clientX; mouseY = t.clientY;
    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }
  document.addEventListener('touchstart', onTouch, { passive: true });
  document.addEventListener('touchmove', onTouch, { passive: true });

  function updateLoop(){
    cursorX += (mouseX - cursorX) * 0.22;
    cursorY += (mouseY - cursorY) * 0.22;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    requestAnimationFrame(updateLoop);
  }
  requestAnimationFrame(updateLoop);

  function spawnTrail(x, y){
    const el = document.createElement('div');
    el.className = 'cursor-trail';
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const s = 4 + Math.random() * 6;
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.opacity = (0.7 + Math.random()*0.3).toString();

    document.body.appendChild(el);
    activeTrails++;

    const life = 1000;
    setTimeout(()=>{
      if(el && el.parentNode) el.parentNode.removeChild(el);
      activeTrails = Math.max(0, activeTrails - 1);
    }, life + 50);
  }

  window.__cursorTrailStatus = () => ({ mouseX, mouseY, cursorX, cursorY, activeTrails });
})();
    </script>
