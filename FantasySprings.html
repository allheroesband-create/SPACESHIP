    <style>
/* カスタムフォント */
@font-face {
    font-family: 'LastChristmas';
    src: url('LastChristmas.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
}

/* --- カーソル：ベース --- */
body { cursor: none; margin:0; background:#0a0a0a; color:#e0e0e0; }

/* カーソル本体（ハート） */
#cursor {
  position: fixed;
  left: 0; top: 0;
  width: 22px; height: 22px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2147483647;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 28 C16 28 4 20 4 12 C4 7 8 4 12 4 C14 4 15 5 16 7 C17 5 18 4 20 4 C24 4 28 7 28 12 C28 20 16 28 16 28 Z' fill='%23ff4d88'/></svg>");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 0 4px rgba(255,80,140,0.95)) drop-shadow(0 0 10px rgba(255,80,140,0.7)) drop-shadow(0 0 18px rgba(255,150,180,0.5));
  animation: heartBeat 1.4s ease-in-out infinite;
  will-change: transform, left, top;
}

/* ハートの鼓動 */
@keyframes heartBeat {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  15%      { transform: translate(-50%, -50%) scale(1.18); }
  30%      { transform: translate(-50%, -50%) scale(0.96); }
  45%      { transform: translate(-50%, -50%) scale(1.08); }
  60%      { transform: translate(-50%, -50%) scale(1); }
}

/* 軌跡 */
.cursor-trail {
  position: fixed;
  left: 0; top: 0;
  width: 6px; height: 6px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 2147483646;
  background: radial-gradient(circle, rgba(255,120,170,0.95), rgba(255,160,190,0.6) 30%, transparent 80%);
  will-change: transform, opacity;
  animation: trailFade 900ms cubic-bezier(.22,.9,.3,1) forwards;
}

/* 軌跡フェード（短めで視認性良く） */
@keyframes trailFade {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
}

/* =============================================
   オープニング映像オーバーレイ
   ============================================= */
#intro-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2147483646; /* カーソルより下、それ以外より上 */
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.8s ease;
    cursor: none;
}
#intro-overlay.fade-out { opacity: 0; }
#intro-overlay.hidden   { display: none; }
#intro-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
#intro-skip-hint {
    position: absolute;
    bottom: 24px;
    right: 28px;
    color: rgba(255,255,255,0.5);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
    animation: skipHintFade 4s ease-in-out infinite;
}
@keyframes skipHintFade {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 0.8; }
}
</style>

        /* =============================================
           post-hero: 画像背景＋テキストオーバーレイ投稿
           img と .post-hero-text を CSS Grid で同セルに重ねる。
           ============================================= */
        .post-hero {
            display: grid;
            grid-template-areas: "stack";
            border: 2px solid #333;
            border-radius: 20px;
            text-decoration: none;
            background: #1a1a1a;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1366 / 100; /* #1 vernal-equinox.png に合わせた比率 */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .post-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.55s ease;
            z-index: 3;
            pointer-events: none;
        }

        .post-hero:hover::before {
            left: 100%;
        }

        .post-hero img {
            grid-area: stack;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
            transition: transform 0.4s ease;
        }

        .post-hero .post-hero-text {
            grid-area: stack;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 12px 20px;
            min-height: 0;
            background: rgba(0, 0, 0, 0.40);
            text-align: center;
            z-index: 1;
            transition: background 0.3s ease;
        }

        .post-hero:hover .post-hero-text {
            background: rgba(0, 0, 0, 0.52);
        }

        .post-hero .post-hero-text .postdate {
            display: block;
            font-size: 0.95em;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow:
                0 0 8px  rgba(0,0,0,1),
                0 0 16px rgba(0,0,0,0.9),
                1px  1px 0 rgba(0,0,0,1),
                -1px -1px 0 rgba(0,0,0,1),
                1px -1px 0 rgba(0,0,0,1),
                -1px  1px 0 rgba(0,0,0,1);
        }

        .post-hero .post-hero-text .post-title {
            color: #ffffff;
            font-family: 'Georgia', serif;
            font-size: 1.4em;
            line-height: 1.4;
            letter-spacing: 1px;
            word-break: break-word;
            text-shadow:
                0 0 8px  rgba(0,0,0,1),
                0 0 20px rgba(0,0,0,0.9),
                1px  1px 0 rgba(0,0,0,1),
                -1px -1px 0 rgba(0,0,0,1),
                1px -1px 0 rgba(0,0,0,1),
                -1px  1px 0 rgba(0,0,0,1);
        }

        .post-hero:hover {
            border-color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(255,255,255,0.4);
            z-index: 10;
        }

        .post-hero:hover img {
            transform: scale(1.03);
        }

        .section-heading {

            gap: 15px;
            width: 100%;
        }

        .character-btn {
            display: block;
            padding: 18px 20px;
            background: rgba(26,26,26,0.7);
            border: 2px solid #333;
            border-radius: 30px;
            color: #e0e0e0;

            font-size: 1.1em;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;

            backdrop-filter: blur(2px);
        }

        .character-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            background: rgba(40,40,40,0.8);
        }

        /* =============================================
           キャラクター紹介モーダル
           ============================================= */
        .character-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2147483640;
            opacity: 1;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .character-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .character-modal-panel {
            position: relative;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(10,10,20,0.95));
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 40px 35px 35px;
            color: #e0e0e0;
            box-shadow: 0 0 40px rgba(255,255,255,0.2), 0 0 80px rgba(255,255,255,0.1);
            transform: translateY(0);
            transition: transform 0.35s cubic-bezier(.22,.9,.3,1);
        }

        .character-modal.hidden .character-modal-panel {
            transform: translateY(-30px);
        }

        .character-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 2em;
            line-height: 1;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .character-modal-close:hover {
            background: rgba(255,255,255,0.15);
            transform: rotate(90deg);
        }

        .character-modal-name {
            font-family: 'LastChristmas', 'Impact', 'Arial Black', sans-serif;
            font-size: 1.8em;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .character-modal-body {
            font-family: 'Georgia', serif;
            font-size: 1em;
            line-height: 1.8;
            color: #d0d0d0;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .section-heading { font-size: 1.5em; }
            .character-modal-panel { padding: 35px 25px 25px; }
            .character-modal-name { font-size: 1.4em; }

    <script>
        function toggleTab(tab) {
            const homeHeader = document.getElementById('home-header');
            const menuHeader = document.getElementById('menu-header');
            const homeContent = document.getElementById('home-content');
            const menuContent = document.getElementById('menu-content');

            if (tab === 'home') {
                homeHeader.classList.add('header_highlight');
                menuHeader.classList.remove('header_highlight');
                homeContent.classList.add('active');
                menuContent.classList.remove('active');
            } else {
                menuHeader.classList.add('header_highlight');
                homeHeader.classList.remove('header_highlight');
                menuContent.classList.add('active');
                homeContent.classList.remove('active');
            }
        }

        function toggleArchiveCategory(category) {
            const itemsDiv = document.getElementById(category + '-items');
            const button = event.target;
            
            if (itemsDiv.classList.contains('show')) {
                itemsDiv.classList.remove('show');
                button.classList.remove('active');
            } else {
                itemsDiv.classList.add('show');
                button.classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('home-content') && document.getElementById('home-content').classList.add('active');
        });
    </script>

    <!-- ========== キャラクター紹介モーダル ========== -->
    <script>
        function openCharacterModal(charId) {
            const dataEl = document.querySelector(`#character-data [data-char-id="${charId}"]`);
            if (!dataEl) return;
            const name = dataEl.getAttribute('data-char-name') || '';
            const body = dataEl.textContent.trim();
            document.getElementById('character-modal-name').textContent = name;
            document.getElementById('character-modal-body').textContent = body;
            const modal = document.getElementById('character-modal');
            modal.classList.remove('hidden');
            // ページ背後のスクロールをロック
            document.body.style.overflow = 'hidden';
        }

        function closeCharacterModal() {
            const modal = document.getElementById('character-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function closeCharacterModalOnBackdrop(event) {
            // パネル外（背景）をクリックした時だけ閉じる
            if (event.target.id === 'character-modal') {
                closeCharacterModal();
            }
        }

        // ESCキーでも閉じられるように
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('character-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    closeCharacterModal();
                }
            }
        });
    </script>

    <script>
(function(){
  const cursor = document.getElementById('cursor');
  if(!cursor) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX, cursorY = mouseY;

  const minInterval = 40;
  let lastTrailTime = 0;
  const maxTrails = 60;
  let activeTrails = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;

    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }, { passive: true });

  function onTouch(e){
    if(!e) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    mouseX = t.clientX; mouseY = t.clientY;
    const now = performance.now();
    if(now - lastTrailTime >= minInterval && activeTrails < maxTrails){
      spawnTrail(mouseX, mouseY);
      lastTrailTime = now;
    }
  }
  document.addEventListener('touchstart', onTouch, { passive: true });
  document.addEventListener('touchmove', onTouch, { passive: true });

  function updateLoop(){
    cursorX += (mouseX - cursorX) * 0.22;
    cursorY += (mouseY - cursorY) * 0.22;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    requestAnimationFrame(updateLoop);
  }
  requestAnimationFrame(updateLoop);

  function spawnTrail(x, y){
    const el = document.createElement('div');
    el.className = 'cursor-trail';
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const s = 4 + Math.random() * 6;
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.opacity = (0.7 + Math.random()*0.3).toString();

    document.body.appendChild(el);
    activeTrails++;

    const life = 1000;
    setTimeout(()=>{
      if(el && el.parentNode) el.parentNode.removeChild(el);
      activeTrails = Math.max(0, activeTrails - 1);
    }, life + 50);
  }

  window.__cursorTrailStatus = () => ({ mouseX, mouseY, cursorX, cursorY, activeTrails });
})();
    </script>

    <!-- ========== オープニング映像オーバーレイ ========== -->
    <script>
(function(){
    const overlay = document.getElementById('intro-overlay');
    const video   = document.getElementById('intro-video');
    if (!overlay || !video) return;

    let dismissed = false;

    function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.classList.add('fade-out');
        // フェードアウト完了後にDOMから外す
        setTimeout(() => {
            overlay.classList.add('hidden');
            // 動画リソースを解放
            try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e) {}
        }, 850);
    }

    // 動画が再生し終わったら自動でフェードアウト
    video.addEventListener('ended', dismiss);

    // クリック/タップでスキップ
    overlay.addEventListener('click', dismiss);
    overlay.addEventListener('touchstart', dismiss, { passive: true });

    // ESCキーでもスキップ
    document.addEventListener('keydown', function(e) {
        if (!dismissed && (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter')) {
            dismiss();
        }
    });

    // 動画ファイルがロード失敗 / 存在しない場合は即座に消す（ページが永遠に隠れるのを防ぐ）
    video.addEventListener('error', dismiss);

    // 万一、何らかの理由で30秒経ってもended が来なかった場合のフォールバック
    setTimeout(dismiss, 30000);

    // 自動再生がブラウザにブロックされた場合の保険
    const playPromise = video.play();
    if (playPromise && playPromise.catch) {
        playPromise.catch(() => {
            // 自動再生がブロックされたら、オーバーレイを早めに消してページを見せる
            setTimeout(dismiss, 500);
        });
    }
})();
    </script>
